<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a0a0c" />
      <stop offset="100%" stop-color="#141419" />
    </linearGradient>
    <linearGradient id="glow" x1="120" y1="100" x2="392" y2="412" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="blurFilter" x="0" y="0" width="512" height="512" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="30" />
    </filter>
  </defs>
  <!-- Background squircle -->
  <rect width="512" height="512" rx="118" fill="url(#bg)" />
  
  <!-- Subtle ambient glow -->
  <circle cx="256" cy="256" r="140" fill="url(#glow)" opacity="0.35" filter="url(#blurFilter)" />
  
  <!-- Inner glyph: Fluid Cadenza quill/flame crescent -->
  <path d="M 256 110 C 230 160 210 220 210 270 C 210 330 245 375 290 375 C 340 375 370 330 370 270 C 370 190 310 135 256 110 Z" fill="url(#glow)" opacity="0.9" />
  <path d="M 230 180 C 190 220 160 270 160 320 C 160 380 205 410 256 410 C 215 410 185 370 185 320 C 185 270 210 230 230 180 Z" fill="#ffffff" opacity="0.4" />
  
  <!-- Sparkle core -->
  <circle cx="256" cy="280" r="12" fill="#ffffff" opacity="0.95" />
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Cadenza: a black-box stage. Pitch black, one gilt mark, one hairline. -->
  <defs>
    <style>
      .mark {
        font-family: Newsreader, Georgia, "Times New Roman", serif;
        font-weight: 500;
        font-size: 300px;
      }
    </style>
  </defs>

  <!-- Pitch black squircle -->
  <rect width="512" height="512" rx="114" fill="#000000" />

  <!-- Single hairline ring: structure without a fill -->
  <circle cx="256" cy="256" r="188" stroke="#ffffff" stroke-opacity="0.10" stroke-width="2" fill="none" />
  <circle cx="256" cy="256" r="152" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1.5" fill="none" />

  <!-- Gilt monogram -->
  <text x="256" y="258" text-anchor="middle" dominant-baseline="central" class="mark" fill="#cfa961">C</text>

  <!-- One quiet accent tick, bottom right of the ring -->
  <path d="M 392 352 A 188 188 0 0 1 300 424" stroke="#cfa961" stroke-width="4" stroke-linecap="round" fill="none" />
</svg>
